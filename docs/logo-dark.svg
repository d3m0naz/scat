<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 160" width="470" height="160" role="img" aria-label="scat">
  <title>scat</title>
  <!-- scat logo: the website's paw as the prompt, then the name in a 5x7
       terminal font and a (static) block cursor, on a CRT tile with scanlines.
       The letters are drawn pixels, not text, so the logo looks the same
       without any font installed. Dark variant. -->
  <defs>
    <radialGradient id="tube" cx="50%" cy="45%" r="75%">
      <stop offset="0" class="bg0"/>
      <stop offset="1" class="bg1"/>
    </radialGradient>
    <pattern id="lines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1.5" class="scan"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="470" height="160" rx="12"/></clipPath>
  </defs>
  <style>
    .bg0 { stop-color: #0e1a12; }
    .bg1 { stop-color: #040705; }
    .frame { stroke: #1f5f2f; }
    .name, .cursor { fill: #33ff66; filter: url(#glow); }
    .paw { fill: #55ffff; filter: url(#glow); }
    .scan { fill: #000000; opacity: 0.35; }
  </style>
  <g clip-path="url(#tile)">
    <rect width="470" height="160" fill="url(#tube)"/>
    <g class="paw" transform="translate(20.5 28.25) scale(0.9)">
      <ellipse cx="60" cy="78" rx="30" ry="26"/>
      <ellipse cx="26" cy="46" rx="11" ry="14" transform="rotate(-18 26 46)"/>
      <ellipse cx="44" cy="26" rx="11" ry="15" transform="rotate(-6 44 26)"/>
      <ellipse cx="76" cy="26" rx="11" ry="15" transform="rotate(6 76 26)"/>
      <ellipse cx="94" cy="46" rx="11" ry="14" transform="rotate(18 94 46)"/>
    </g>
    <g class="name">
      <rect x="155" y="65" width="10" height="10"/>
      <rect x="165" y="65" width="10" height="10"/>
      <rect x="175" y="65" width="10" height="10"/>
      <rect x="185" y="65" width="10" height="10"/>
      <rect x="145" y="75" width="10" height="10"/>
      <rect x="155" y="85" width="10" height="10"/>
      <rect x="165" y="85" width="10" height="10"/>
      <rect x="175" y="85" width="10" height="10"/>
      <rect x="185" y="95" width="10" height="10"/>
      <rect x="145" y="105" width="10" height="10"/>
      <rect x="155" y="105" width="10" height="10"/>
      <rect x="165" y="105" width="10" height="10"/>
      <rect x="175" y="105" width="10" height="10"/>
      <rect x="215" y="65" width="10" height="10"/>
      <rect x="225" y="65" width="10" height="10"/>
      <rect x="235" y="65" width="10" height="10"/>
      <rect x="245" y="65" width="10" height="10"/>
      <rect x="205" y="75" width="10" height="10"/>
      <rect x="205" y="85" width="10" height="10"/>
      <rect x="205" y="95" width="10" height="10"/>
      <rect x="215" y="105" width="10" height="10"/>
      <rect x="225" y="105" width="10" height="10"/>
      <rect x="235" y="105" width="10" height="10"/>
      <rect x="245" y="105" width="10" height="10"/>
      <rect x="275" y="65" width="10" height="10"/>
      <rect x="285" y="65" width="10" height="10"/>
      <rect x="295" y="65" width="10" height="10"/>
      <rect x="305" y="75" width="10" height="10"/>
      <rect x="275" y="85" width="10" height="10"/>
      <rect x="285" y="85" width="10" height="10"/>
      <rect x="295" y="85" width="10" height="10"/>
      <rect x="305" y="85" width="10" height="10"/>
      <rect x="265" y="95" width="10" height="10"/>
      <rect x="305" y="95" width="10" height="10"/>
      <rect x="275" y="105" width="10" height="10"/>
      <rect x="285" y="105" width="10" height="10"/>
      <rect x="295" y="105" width="10" height="10"/>
      <rect x="305" y="105" width="10" height="10"/>
      <rect x="335" y="45" width="10" height="10"/>
      <rect x="335" y="55" width="10" height="10"/>
      <rect x="325" y="65" width="10" height="10"/>
      <rect x="335" y="65" width="10" height="10"/>
      <rect x="345" y="65" width="10" height="10"/>
      <rect x="355" y="65" width="10" height="10"/>
      <rect x="335" y="75" width="10" height="10"/>
      <rect x="335" y="85" width="10" height="10"/>
      <rect x="335" y="95" width="10" height="10"/>
      <rect x="345" y="105" width="10" height="10"/>
      <rect x="355" y="105" width="10" height="10"/>
      <rect x="365" y="105" width="10" height="10"/>
    </g>
    <rect class="cursor" x="385" y="45" width="50" height="70"/>
    <rect width="470" height="160" fill="url(#lines)"/>
  </g>
  <rect class="frame" x="5" y="5" width="460" height="150" rx="8" fill="none" stroke-width="2"/>
</svg>
