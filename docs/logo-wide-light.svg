      <path class="area" d="M478 98 490 94 502 100 514 86 526 90 538 72 550 80 562 66 574 76 586 60 598 68 608 58 V115 H478 Z"/>
      <polyline class="graph" points="478 98 490 94 502 100 514 86 526 90 538 72 550 80 562 66 574 76 586 60 598 68 608 58" stroke-width="2" stroke-linejoin="round"/>
      <circle class="led" cx="608" cy="58" r="3"/>
      <rect class="line" x="640" y="45" width="120" height="20" rx="2"/>
      <circle class="led" cx="651" cy="55" r="3"/>
      <circle class="led" cx="661" cy="55" r="3" opacity="0.45"/>
