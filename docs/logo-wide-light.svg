      <rect class="heat" x="796" y="72" width="6" height="34" rx="3"/>
      <circle class="heat" cx="799" cy="109" r="5.5"/>
      <path class="line" d="M810 52 h6"/>
      <path class="line" d="M810 64 h6"/>
      <path class="line" d="M810 76 h6"/>
      <path class="line" d="M810 88 h6"/>
      <path class="line" d="M478 133 H816" stroke-dasharray="1 5" stroke-linecap="round"/>
      <path class="line" d="M543 115 V133"/>
      <path class="line" d="M700 115 V133"/>
      <path class="line" d="M799 118 V133"/>
      <rect class="node" x="540" y="130" width="6" height="6"/>
      <rect class="node" x="697" y="130" width="6" height="6"/>
      <rect class="node" x="796" y="130" width="6" height="6"/>
    </g>
    <rect class="cursor" x="385" y="45" width="50" height="70"/>
    <rect width="848" height="160" fill="url(#lines)"/>
  </g>
  <rect class="frame" x="5" y="5" width="838" height="150" rx="8" fill="none" stroke-width="2"/>
</svg>
