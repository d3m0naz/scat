<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 160" width="848" height="160" role="img" aria-label="scat">
  <title>scat</title>
  <!-- scat logo: the website's paw as the prompt, then the name in a 5x7
       terminal font and a (static) block cursor, on a CRT tile with scanlines.
       Wide variant: on the right a quiet status panel (load graph, a
       three-unit server rack, a thermometer) on a network line.
       The letters are drawn pixels, not text, so the logo looks the same
       without any font installed. Light variant. -->
  <defs>
    <radialGradient id="tube" cx="30%" cy="45%" r="80%">
      <stop offset="0" class="bg0"/>
      <stop offset="1" class="bg1"/>
    </radialGradient>
    <pattern id="lines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1.5" class="scan"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ledglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="848" height="160" rx="12"/></clipPath>
  </defs>
  <style>
    .bg0 { stop-color: #fbf8ee; }
    .bg1 { stop-color: #ece6d2; }
    .frame { stroke: #bdb596; }
    .name, .cursor { fill: #1a6b2c; filter: none; }
    .paw { fill: #0a6a8a; filter: none; }
    .scan { fill: #5c5436; opacity: 0.07; }
    .line { stroke: #6b7a5c; opacity: 0.6; fill: none; }
    .graph { stroke: #1a6b2c; fill: none; opacity: 0.85; }
    .area { fill: #1a6b2c; opacity: 0.07; }
    .led { fill: #1a6b2c; }
    .led-warn { fill: #8a6100; }
    .bay { fill: #6b7a5c; opacity: 0.4; }
    .heat { fill: #8a6100; opacity: 0.8; }
    .node { fill: #0a6a8a; opacity: 0.75; }
  </style>
  <g clip-path="url(#tile)">
    <rect width="848" height="160" fill="url(#tube)"/>
    <g class="paw" transform="translate(20.5 28.25) scale(0.9)">
      <ellipse cx="60" cy="78" rx="30" ry="26"/>
      <ellipse cx="26" cy="46" rx="11" ry="14" transform="rotate(-18 26 46)"/>
      <ellipse cx="44" cy="26" rx="11" ry="15" transform="rotate(-6 44 26)"/>
      <ellipse cx="76" cy="26" rx="11" ry="15" transform="rotate(6 76 26)"/>
      <ellipse cx="94" cy="46" rx="11" ry="14" transform="rotate(18 94 46)"/>
    </g>
    <g class="name">
      <rect x="155" y="65" width="10" height="10"/>
      <rect x="165" y="65" width="10" height="10"/>
      <rect x="175" y="65" width="10" height="10"/>
      <rect x="185" y="65" width="10" height="10"/>
